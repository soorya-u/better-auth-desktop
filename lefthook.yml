pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run check
    typecheck:
      run: bun run typecheck

pre-push:
  piped: true
  commands:
    test:
      run: bun run test --run
    build:
      run: bun run build
    lint-package:
      run: bun run lint:package
    lint-types:
      run: bun run lint:types
